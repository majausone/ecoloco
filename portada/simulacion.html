<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoLoco · Simulation</title>
<style>
  :root { --fondo:#0d0b0a; --caja:rgba(20,16,15,.86); --borde:#3a2f29; --texto:#efe4d2; --acento:#e8a64a; --boton:#2a221e; --boton-borde:#4a3c34; }
  html, body { margin:0; background:var(--fondo); color:var(--texto); font:14px/1.5 system-ui, sans-serif; }
  body { background:linear-gradient(rgba(13,11,10,.35), rgba(13,11,10,.5) 200px, rgba(13,11,10,.9) 330px, var(--fondo) 410px) no-repeat, url('fondo.png') center -140px / max(100%, 1400px) auto no-repeat var(--fondo); min-height:100vh; }
  header { padding-top:20px; }
  .pagina { max-width:1120px; margin:0 auto; padding:34px 22px 60px; }
  header h1 { font-size:54px; margin:0; letter-spacing:.02em; color:var(--acento); font-weight:700; text-shadow:0 2px 18px #000; }
  header p { font-size:17px; margin:4px 0 0; max-width:720px; opacity:.92; text-shadow:0 1px 8px #000; }
  .accesos { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:10px; margin:26px 0 30px; }
  .acceso { display:block; text-decoration:none; color:var(--texto); background:var(--caja); border:1px solid var(--borde); border-radius:8px; padding:12px 14px; transition:border-color .15s; }
  .acceso:hover { border-color:var(--acento); }
  .acceso b { display:block; color:var(--acento); font-size:15px; } .acceso span { font-size:12.5px; opacity:.8; }
  h2 { font-size:19px; margin:0 0 10px; color:var(--acento); font-weight:600; }
  .explica { opacity:.75; font-size:13px; margin:0 0 12px; }
  .caja { background:var(--caja); border:1px solid var(--borde); border-radius:8px; padding:16px 18px; margin-bottom:14px; }
  .dos { display:grid; grid-template-columns:minmax(0, 1.55fr) minmax(0, 1fr); gap:14px; align-items:start; }
  @media (max-width:860px) { .dos { grid-template-columns:1fr; } }
  button { background:var(--boton); color:var(--texto); border:1px solid var(--boton-borde); border-radius:5px; padding:4px 11px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acento); }
  button.on { background:var(--acento); color:#1a1410; border-color:var(--acento); }
  button:disabled { opacity:.45; cursor:default; }
  .preajustes { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  .preajuste-texto { font-size:13px; opacity:.85; min-height:2.8em; margin:4px 0 10px; }
  .opcion { display:grid; grid-template-columns:120px 1fr; align-items:center; gap:4px 12px; padding:7px 0; border-top:1px solid #2c241f; }
  .opcion > .nom { opacity:.8; padding-top:4px; }
  .opcion .botones { display:flex; flex-wrap:wrap; gap:4px; }
  .opcion .linea { grid-column:2; font-size:12px; opacity:.6; }
  .opcion input[type=number] { width:90px; background:#1a1512; color:var(--texto); border:1px solid var(--boton-borde); border-radius:5px; padding:4px 7px; font:inherit; }
  .pestanas { display:flex; gap:4px; margin:6px 0 10px; }
  .especies { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; max-height:370px; overflow:auto; padding-right:4px; }
  .esp { display:flex; gap:8px; align-items:center; background:#1a1512; border:1px solid var(--boton-borde); border-radius:6px; padding:4px; cursor:pointer; user-select:none; }
  .esp img { width:38px; height:38px; object-fit:cover; border-radius:4px; flex:none; background:#2a221e; }
  .esp .n { font-size:12.5px; line-height:1.25; } .esp .g { font-size:11px; opacity:.6; }
  .esp.on { border-color:var(--acento); } .esp:not(.on) { opacity:.45; } .esp:not(.on) img { filter:grayscale(1); }
  .aviso { font-size:12.5px; color:#f0b0a0; margin-top:8px; min-height:1.2em; }
  .resumen table { width:100%; border-collapse:collapse; font-size:13px; } .resumen td { padding:2px 0; vertical-align:top; }
  .resumen td:last-child { text-align:right; font-variant-numeric:tabular-nums; color:var(--acento); padding-left:10px; white-space:nowrap; }
  .resumen h3 { font-size:13px; font-weight:normal; text-transform:uppercase; letter-spacing:.04em; color:var(--acento); margin:12px 0 4px; }
  .empezar { text-align:center; margin:22px 0 22px; } .empezar p { margin:8px auto 0; max-width:640px; font-size:13px; }
  .generar.grande { width:auto; min-width:min(420px, 100%); font-size:20px; padding:14px 28px; margin:0; border-radius:8px; box-shadow:0 4px 22px rgba(232,166,74,.35); }
  .generar { width:100%; margin-top:14px; padding:10px; font-size:16px; background:var(--acento); color:#1a1410; border-color:var(--acento); font-weight:600; }
  .guardados .fila { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid #2c241f; }
  .guardados .fila .t { flex:1; } .guardados .fila .t small { opacity:.6; display:block; }
  .gris { opacity:.6; }
  input[type=file] { display:none; }
  @media (max-width:640px) {
    .pagina { padding:16px 10px 40px; }
    .caja { padding:12px 12px; }
    .opcion { grid-template-columns:1fr; gap:4px; }
    .opcion > .nom { padding-top:0; }
    .tamano { flex-wrap:wrap; }
    .tamano input[type=range] { min-width:0; width:100%; flex:1 1 100%; }
    .especies { grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); }
    .pestanas { flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="pagina">
  <div class="empezar">
    <button class="generar grande" id="empezar" data-en="▶ Start the simulation">▶ Empezar la simulación</button>
    <p class="gris" data-en="With the world set up below (Maliau, mature forest, by default). It opens in a new tab; change whatever you like first.">Con el mundo que configures aquí abajo (Maliau, bosque maduro, si no tocas nada). Se abre en otra pestaña; antes cambia lo que quieras.</p>
  </div>

  <div class="dos" id="nuevo">
    <div>
      <div class="caja">
        <h2><span data-en="A new world">Un mundo nuevo</span><span class="ayuda" data-es="Elige un punto de partida y cambia lo que quieras. El mundo se genera entero al entrar." data-en="Choose a starting point and change whatever you like. The whole world is generated when you enter."></span></h2>
        <div class="preajustes" id="preajustes"></div>
        <div class="preajuste-texto" id="preajuste-texto"></div>
        <div id="opciones"></div>
      </div>
      <div class="caja">
        <h2><span data-en="Species">Especies</span><span class="ayuda" data-es="Pulsa una especie para quitarla o volver a ponerla. Si un grupo del motor se queda sin ninguna, sale también del motor." data-en="Click a species to remove it or put it back. If an engine group is left with none, it leaves the engine too."></span></h2>
        <div class="pestanas" id="pestanas"></div>
        <div class="especies" id="especies"></div>
        <div class="aviso" id="aviso-especies"></div>
      </div>
    </div>
    <div>
      <div class="caja resumen">
        <h2 data-en="What it will have">Lo que va a tener</h2>
        <div id="resumen" class="gris" data-en="Reading the Maliau scenario…">Leyendo el escenario de Maliau…</div>
        <button class="generar" id="generar" data-en="Generate the world and enter (new tab)">Generar el mundo y entrar (en otra pestaña)</button>
      </div>
      <div class="caja guardados">
        <h2><span data-en="Saved worlds">Mundos guardados</span><span class="ayuda" data-es="Los que guardes desde la simulación (botón «Guardar» del panel). Al abrir uno, el motor se recalcula deprisa hasta su día." data-en="The ones you save from the simulation (the panel’s «Save» button). When you open one, the engine is quickly recomputed up to its day."></span></h2>
        <div id="guardados"></div>
        <button id="cargar" style="margin-top:8px" data-en="Load from a file…">Cargar desde un archivo…</button><input type="file" id="archivo" accept=".json,application/json">
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="../comun/comun.css">
<script type="module" src="./portada.js"></script>
</body>
</html>
